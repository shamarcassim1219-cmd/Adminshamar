name: Build Admin APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate missing platform folders
        run: flutter create --platforms=android --project-name mygame_admin_app --org com.mygame.admin .

      - name: Restore Firebase config
        run: echo "${{ secrets.FIREBASE_ANDROID_CONFIG }}" | base64 --decode > android/app/google-services.json

      - name: Validate google-services.json
        run: python3 -c "import json; json.load(open('android/app/google-services.json'))"

      - name: Fix Kotlin Gradle plugin
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
          sed -i "s/id 'org.jetbrains.kotlin.android' version '[^']*'/id 'org.jetbrains.kotlin.android' version '1.9.24'/" android/settings.gradle

      - name: Add Firebase Google Services plugin settings
        run: sed -i '/id "dev.flutter.flutter-plugin-loader"/a\    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle

      - name: Add Firebase Google Services plugin app
        run: sed -i '/id "dev.flutter.flutter-gradle-plugin"/a\    id "com.google.gms.google-services"' android/app/build.gradle

      - name: Install dependencies
        run: flutter pub get

      - name: Fix applicationId
        run: |
          sed -i 's/applicationId = "com.mygame.admin.mygame_admin_app"/applicationId = "com.mygame.admin"/' android/app/build.gradle
          sed -i 's/applicationId "com.mygame.admin.mygame_admin_app"/applicationId "com.mygame.admin"/' android/app/build.gradle

      - name: DEBUG - print applicationId and google-services.json package
        run: |
          echo "=== build.gradle applicationId lines ==="
          grep -n "applicationId" android/app/build.gradle
          echo "=== google-services.json packages ==="
          python3 -c "import json; d=json.load(open('android/app/google-services.json')); [print(c['client_info']['android_client_info']['package_name']) for c in d['client']]"
          echo "=== app/build.gradle plugins block ==="
          grep -n -A 5 "^plugins {" android/app/build.gradle
          echo "=== settings.gradle plugins block ==="
          grep -n -A 8 "^plugins {" android/settings.gradle

      - name: Bump minSdkVersion to 23
        run: sed -i 's/flutter.minSdkVersion/23/' android/app/build.gradle

      - name: Ensure permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q "android.permission.INTERNET" "$MANIFEST" || sed -i '/<\/manifest>/i\    <uses-permission android:name="android.permission.INTERNET" \/>' "$MANIFEST"
          grep -q "android.permission.POST_NOTIFICATIONS" "$MANIFEST" || sed -i '/<\/manifest>/i\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>' "$MANIFEST"

      - name: Add FCM default notification icon
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q "com.google.firebase.messaging.default_notification_icon" "$MANIFEST" || sed -i '/<\/application>/i\        <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@mipmap/ic_launcher" \/>\n        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@android:color/white" \/>' "$MANIFEST"

      - name: Generate debug keystore if missing
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mygame-admin-release
          path: build/app/outputs/flutter-apk/app-release.apk
